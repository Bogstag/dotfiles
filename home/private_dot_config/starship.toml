"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 200
scan_timeout = 10

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#1d2230)\
$nodejs\
[ ](fg:#1d2230)\
\n$character"""

[character]
error_symbol = "[✗](bold #f7768e)"
success_symbol = "[❯](bold #7aa2f7)"

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "bg:#a3aed2 fg:#090c0c"

[os.symbols]
Arch = "󰣇"
Windows = "󰍲"

[directory]
format = "[ $path ]($style)"
style = "fg:#e3e5e5 bg:#769ff0"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = " "
Pictures = " "
Projects = "󰲋 "

[git_branch]
format = "[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)"
style = "bg:#394260"
symbol = ""

[git_status]
format = "[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)"
style = "bg:#394260"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
conflicted = ""
up_to_date = ""
untracked = "?"
modified = ""
stashed = ""
staged = ""
renamed = ""
deleted = ""

[nodejs]
detect_extensions = []
detect_files = ["package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
detect_folders = ["node_modules"]
format = "[[ $symbol ($version) ](fg:#a0a9cb bg:#1d2230)]($style)"
style = "bg:#1d2230"
symbol = ""
