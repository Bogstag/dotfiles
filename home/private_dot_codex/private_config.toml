#:schema https://learn.chatgpt.com/docs/config-schema.json
# https://github.com/openai/codex/blob/main/codex-rs/models-manager/models.json
# tombi: format.rules.table-keys-order = "ascending"

model_provider = "aperture"

approvals_reviewer = "auto_review"
model = "gpt-6-luna"
model_reasoning_effort = "medium"
model_verbosity = "low"
sandbox_mode = "workspace-write"

[agents]
  max_depth = 2
  max_concurrent_threads_per_session = 4

[apps.connector_20205bf7d4e99a89d7154bb849718324]
  enabled = false

[apps.connector_openai_chatgpt_pets]
  enabled = false

[desktop]
  ambient-suggestions-enabled = false
  appearanceDarkCodeThemeId = "dracula"
  appearanceTheme = "dark"
  codeFontSize = 13
  conversationDetailMode = "STEPS_COMMANDS"
  external-agent-import-sync-enabled = false
  followUpQueueMode = "steer"
  sansFontSize = 14

[desktop.appearanceDarkChromeTheme]
  accent = "#f077af"
  accentSource = "chatgpt"
  contrast = 60
  ink = "#f8f8f2"
  opaqueWindows = false
  surface = "#282a36"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
  diffAdded = "#50fa7b"
  diffRemoved = "#ff5555"
  skill = "#ff79c6"

# tombi: format.rules.table-keys-order = "ascending"
[features]
  analytics_plan_history = true
  fast_mode = false
  hooks = true
  login_shell_package_path = true
  memories = true
  multi_agent = true

[features.guardianv2]
  enabled = false

[hooks.state."/home/bogge/.codex/hooks.json:session_start:0:0"]
  trusted_hash = "sha256:25c9ca70d3148d3004ea3982a4b1f9e085528cb65790f18ec2f91c3af7df687d"

[marketplaces.engram]
  source_type = "git"
  source = "https://github.com/Gentleman-Programming/engram.git"
  ref = "main"

[marketplaces.openai-bundled]
  source_type = "local"
  source = "/home/bogge/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
  source_type = "local"
  source = "/home/bogge/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.plugins]
  source_type = "local"
  source = "/home/bogge/Projects/plugins"

[mcp_servers.aperture]
  url = "http://ai.goldeye-monster.ts.net/v1/mcp"

[mcp_servers.codegraph]
  command = "codegraph"
  args = ["serve", "--mcp"]

[mcp_servers.context7]
  url = "https://mcp.context7.com/mcp"

[mcp_servers.hk]
  args = ["mcp", "--root", "."]
  command = "hk"

[mcp_servers.node_repl]
  args = []
  command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
  startup_timeout_sec = 120
  enabled = false

[mcp_servers.node_repl.env]
  NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
  NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
  NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
  NODE_REPL_TRUSTED_CODE_PATHS = "/home/bogge/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
  CODEX_HOME = "/home/bogge/.codex"
  BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
  BROWSER_USE_TINYSKY_ENABLED = "1"
  NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
  NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
  BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
  BROWSER_USE_CODEX_APP_VERSION = "26.1013.40934"
  NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/bogge/.codex/plugins/cache/openai-bundled/browser/26.1013.40934/scripts/browser-service.mjs"}'
  CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[memories]
  generate_memories = true
  use_memories = true

[model_providers.aperture]
  name = "Aperture Proxy"
  base_url = "http://ai.goldeye-monster.ts.net/codex"
  wire_api = "responses"
  requires_openai_auth = true

[plugins."browser@openai-bundled"]
  enabled = true

[plugins."code-review@openai-bundled"]
  enabled = true

[plugins."codex-app-tools@openai-bundled"]
  enabled = true

[plugins."documents@openai-primary-runtime"]
  enabled = true

[plugins."engram@engram"]
  enabled = true

[plugins."hk@plugins"]
  enabled = true

[plugins."homelab@plugins"]
  enabled = true

[plugins."pdf@openai-primary-runtime"]
  enabled = false

[plugins."presentations@openai-primary-runtime"]
  enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
  enabled = false

[plugins."template-creator@openai-primary-runtime"]
  enabled = true

[plugins."unified-computer-use@openai-bundled"]
  enabled = true

[plugins."visualize@openai-bundled"]
  enabled = true

[projects."/home/bogge/.local/share/chezmoi"]
  trust_level = "trusted"

[projects."/home/bogge/Projects/ObsidianRnDVault"]
  trust_level = "trusted"

[sandbox_workspace_write]
  network_access = true

[[skills.config]]
  path = "/home/bogge/.agents/skills/find-skills/SKILL.md"
  enabled = false

[[skills.config]]
  path = "/home/bogge/.agents/skills/fnox/SKILL.md"
  enabled = false

[[skills.config]]
  path = "/home/bogge/.agents/skills/writing-for-agents/SKILL.md"
  enabled = false

[tui]
  fullscreen_transcript = true
  resume_cwd = "session"
  screen_reader_detection_done = true

  # tombi: format.rules.array-values-order = { disabled = true }
  status_line = [
    "model-with-reasoning",
    "project-root",
    "current-dir",
    "git-branch",
    "context-remaining",
    "five-hour-limit",
    "weekly-limit"
  ]
  status_line_use_colors = true
  theme = "dracula"

[tui.model_availability_nux]
  "gpt-6.1-sol" = 4
