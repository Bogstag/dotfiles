#:schema https://learn.chatgpt.com/docs/config-schema.json
# https://ai.goldeye-monster.ts.net/v1/models
# https://github.com/openai/codex/blob/main/codex-rs/models-manager/models.json

model_provider = "aperture"

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
model_verbosity = "low"

[model_providers.aperture]
  name = "Aperture Proxy"
  base_url = "http://ai.goldeye-monster.ts.net/codex"
  wire_api = "responses"
  requires_openai_auth = true

[mcp_servers.aperture]
  url = "http://ai.goldeye-monster.ts.net/v1/mcp"

[mcp_servers.node_repl]
  args = []
  command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
  startup_timeout_sec = 120

[mcp_servers.node_repl.env]
  NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
  NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
  NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
  NODE_REPL_TRUSTED_CODE_PATHS = "/home/bogge/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
  CODEX_HOME = "/home/bogge/.codex"
  BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
  BROWSER_USE_TINYSKY_ENABLED = "1"
  NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
  NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
  BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
  BROWSER_USE_CODEX_APP_VERSION = "26.1007.21434"
  NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/bogge/.codex/plugins/cache/openai-bundled/browser/26.1007.21434/scripts/browser-service.mjs"}'
  CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[projects."/home/bogge/.local/share/chezmoi"]
  trust_level = "trusted"

[marketplaces.openai-bundled]
  source_type = "local"
  source = "/home/bogge/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
  source_type = "local"
  source = "/home/bogge/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.plugins]
  source_type = "local"
  source = "/home/bogge/Projects/plugins"

[plugins."codex-app-tools@openai-bundled"]
  enabled = true

[plugins."browser@openai-bundled"]
  enabled = true

[plugins."visualize@openai-bundled"]
  enabled = true

[plugins."documents@openai-primary-runtime"]
  enabled = true

[plugins."pdf@openai-primary-runtime"]
  enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
  enabled = false

[plugins."presentations@openai-primary-runtime"]
  enabled = false

[plugins."template-creator@openai-primary-runtime"]
  enabled = true

[plugins."unified-computer-use@openai-bundled"]
  enabled = true

[plugins."homelab@plugins"]
  enabled = true

[plugins."hk@plugins"]
  enabled = true

[plugins."code-review@openai-bundled"]
  enabled = true

[desktop]
  ambient-suggestions-enabled = false
  appearanceDarkCodeThemeId = "dracula"
  appearanceTheme = "dark"
  codeFontSize = 13
  conversationDetailMode = "STEPS_COMMANDS"
  external-agent-import-sync-enabled = false
  followUpQueueMode = "steer"
  sansFontSize = 14

[desktop.appearanceDarkChromeTheme]
  accent = "#f077af"
  accentSource = "chatgpt"
  contrast = 60
  ink = "#f8f8f2"
  opaqueWindows = false
  surface = "#282a36"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
  diffAdded = "#50fa7b"
  diffRemoved = "#ff5555"
  skill = "#ff79c6"

[tui]
  resume_cwd = "session"
  screen_reader_detection_done = true
  theme = "dracula"
  fullscreen_transcript = false

[tui.model_availability_nux]
  "gpt-6.1-sol" = 3

[features]
  memories = true
  analytics_plan_history = true
  login_shell_package_path = true

[memories]
  generate_memories = true
  use_memories = true

[sandbox_workspace_write]
  network_access = true

[hooks.state."/home/bogge/.codex/hooks.json:session_start:0:0"]
  trusted_hash = "sha256:25c9ca70d3148d3004ea3982a4b1f9e085528cb65790f18ec2f91c3af7df687d"
