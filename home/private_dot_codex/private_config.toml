#:schema https://learn.chatgpt.com/docs/config-schema.json
# https://github.com/openai/codex/blob/main/codex-rs/models-manager/models.json

model_provider         = "aperture"
# Optional model override for /review. Default: unset (uses current session model).
model                  = "gpt-6-luna"
model_reasoning_effort = "medium"
# Text verbosity for GPT-5 family (Responses API): low | medium | high
model_verbosity        = "low"
sandbox_mode           = "workspace-write"

[apps.connector_20205bf7d4e99a89d7154bb849718324]
  enabled = false

[apps.connector_openai_chatgpt_pets]
  enabled = false

[desktop]
  ambient-suggestions-enabled        = false
  appearanceDarkCodeThemeId          = "dracula"
  appearanceTheme                    = "dark"
  codeFontSize                       = 13
  conversationDetailMode             = "STEPS_PROSE"
  external-agent-import-sync-enabled = false
  followUpQueueMode                  = "steer"
  sansFontSize                       = 14
  autoArchiveAfterDays               = 90
  default-workspace-full-view        = true

[memories]
  generate_memories = true
  use_memories      = true

[features.guardianv2]
  enabled = false

[hooks.state."/home/bogge/.codex/hooks.json:stop:0:0"]
  trusted_hash = "sha256:90f4d7917f32abcb69b4f29cc6e7c17f7ead5bfd7061711e579be125a1861e89"

[marketplaces.plugins]
  source_type = "local"
  source      = "/home/bogge/Projects/plugins"

[marketplaces.openai-bundled]
  source_type = "local"
  source      = "/home/bogge/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
  source_type = "local"
  source      = "/home/bogge/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[mcp_servers.aperture]
  url = "https://ai.goldeye-monster.ts.net/v1/mcp"

[mcp_servers.codegraph]
  command = "codegraph"
  args    = ["serve", "--mcp"]

[mcp_servers.hk]
  args    = ["mcp", "--root", "/home/bogge/.local/share/chezmoi"]
  command = "/home/bogge/.local/share/mise/installs/hk/latest/.mise-bins/hk"

[mcp_servers.mise]
  args    = ["--cd", "/home/bogge/.local/share/chezmoi", "mcp"]
  command = "/usr/bin/mise"

[mcp_servers.node_repl]
  args                = []
  command             = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
  env_vars            = [
    "BROWSER_USE_ACCESS_EXECUTOR_ID",
    "BROWSER_USE_ACCESS_PIPE_PATH",
    "BROWSER_USE_ACCESS_VERIFYING_IDENTITY",
  ]
  startup_timeout_sec = 120

[mcp_servers.node_repl.env]
  NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
  NODE_REPL_NODE_MODULE_DIRS               = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
  NODE_REPL_NODE_PATH                      = "/usr/lib/chatgpt/resources/cua_node/bin/node"
  NODE_REPL_TRUSTED_CODE_PATHS             = "/home/bogge/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
  CODEX_HOME                               = "/home/bogge/.codex"
  BROWSER_USE_AVAILABLE_BACKENDS           = "chrome,iab,mcpapps"
  BROWSER_USE_TINYSKY_ENABLED              = "1"
  NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER  = "Control the in-app browser in conjunction with the Browser Plugin."
  NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME   = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
  BROWSER_USE_CODEX_APP_BUILD_FLAVOR       = "prod"
  BROWSER_USE_CODEX_APP_VERSION            = "26.1021.22027"
  NODE_REPL_TRUSTED_SERVICES               = '{"browser":"/home/bogge/.codex/plugins/cache/openai-bundled/browser/26.1021.22027/scripts/browser-service.mjs"}'
  CODEX_CLI_PATH                           = "/usr/lib/chatgpt/resources/codex"

[mcp_servers.cua_repl]
  command = "/usr/lib/chatgpt/ChatGPT"
  enabled = false

[model_providers.aperture]
  name                 = "Aperture Proxy"
  base_url             = "http://ai.goldeye-monster.ts.net/codex"
  wire_api             = "responses"
  requires_openai_auth = true

[plugins."hk@plugins"]
  enabled = true

[plugins."homelab@plugins"]
  enabled = true

[plugins."browser@openai-bundled"]
  enabled = true

[plugins."code-review@openai-bundled"]
  enabled = true

[plugins."codex-app-tools@openai-bundled"]
  enabled = true

[plugins."documents@openai-primary-runtime"]
  enabled = true

[plugins."pdf@openai-primary-runtime"]
  enabled = false

[plugins."presentations@openai-primary-runtime"]
  enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
  enabled = false

[plugins."template-creator@openai-primary-runtime"]
  enabled = false

[plugins."unified-computer-use@openai-bundled"]
  enabled = false

[plugins."visualize@openai-bundled"]
  enabled = true

[projects."/home/bogge/.local/share/chezmoi"]
  trust_level = "trusted"

[projects."/home/bogge/Projects/ObsidianRnDVault"]
  trust_level = "trusted"

[projects."/home/bogge/Projects/Orlok"]
  trust_level = "trusted"

