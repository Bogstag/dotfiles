#:schema https://www.schemastore.org/tombi.json

toml-version = "v1.1.0"

[files]
  exclude = [".cache/**/*.toml", "**/modify_*.toml"]

[format]
  rules = {
    indent-table-key-value-pairs = true,  # default: false
    line-width = 100,                     # default: 2
    trailing-comment-alignment = true,    # default: false
    # Defaults
    #   array-bracket-space-width = 0,
    #   array-comma-space-width = 1,
    #   comment-style = "normalize",
    #   date-time-delimiter = "T",
    #   group-blank-lines-limit = 1,
    #   indent-style = "space",
    #   indent-sub-tables = false,
    #   inline-table-brace-space-width = 1,
    #   inline-table-comma-space-width = 1,
    #   key-quote-style = "double",
    #   key-value-equals-sign-space-width = 1,
    #   line-ending = "lf",
    #   string-quote-style = "double",
    #   table-blank-lines = 1,
    #   trailing-comment-alignment = false,
    #   trailing-comment-space-width = 2,
  }

[[schemas]]
  path = "https://learn.chatgpt.com/docs/config-schema.json"
  include = [
    "$HOME/.codex/config.toml",
    "$HOME/.codex/*.config.toml",
    "$XDG_DATA_HOME/chezmoi/home/private_dot_codex/private_openai.config",
    "$XDG_DATA_HOME/chezmoi/home/private_dot_codex/private_config.toml"
  ]

[[schemas]]
  path = "https://www.schemastore.org/tombi.json"
  include = ["$HOME/.config/tombi/config.toml", "**/tombi/config.toml", "**/.tombi.toml"]

[[schemas]]
  path = "https://www.schemastore.org/chezmoi.json"
  include = ["$HOME/.config/chezmoi.toml", "**/.chezmoi.toml", "**/chezmoi.toml"]

[[schemas]]
  path = "https://starship.rs/config-schema.json"
  include = ["$HOME/.config/starship.toml", "**/starship.toml"]

[[schemas]]
  path = "https://yazi-rs.github.io/schemas/keymap.json"
  include = ["$HOME/.config/yazi/keymap.toml", "**/yazi/keymap.toml"]

[[schemas]]
  path = "https://yazi-rs.github.io/schemas/yazi.json"
  include = ["$HOME/.config/yazi/yazi.toml", "**/yazi/yazi.toml"]

[[schemas]]
  path = "https://yazi-rs.github.io/schemas/vfs.json"
  include = ["$HOME/.config/yazi/vfs.toml", "**/yazi/vfs.toml"]

[[schemas]]
  path = "https://yazi-rs.github.io/schemas/theme.json"
  include = ["$HOME/.config/yazi/theme.toml", "**/yazi/theme.toml"]

[[schemas]]
  path = "https://yazi-rs.github.io/schemas/package.json"
  include = ["$HOME/.config/yazi/package.toml", "**/yazi/package.toml"]

[[schemas]]
  path = "https://www.schemastore.org/ryl.json"
  include = ["**/ryl/.ryl.toml", "$HOME/.config/ryl/.ryl.toml"]

[[schemas]]
  path = "https://mise.jdx.dev/schema/mise-task.json"
  include = ["**/tasks.toml"]

[[schemas]]
  path = "https://mise.jdx.dev/schema/mise.json"
  include = ["**/mise.toml", "$HOME/.config/mise/config.toml", "**/mise/config.toml"]

[[schemas]]
  path = "https://www.schemastore.org/cargo.json"
  include = ["**/Cargo.toml"]

[[schemas]]
  path = "https://www.schemastore.org/pyproject.json"
  include = ["**/pyproject.toml"]

[[overrides]]
  files.include = ["**/yazi/yazi.toml", "**/yazi/keymap.toml", "**/yazi/theme.toml"]
  format.rules = {
    line-width = 255,
  }
