# [bar]
# Cross-axis size at font base-size 12. size-horizontal is the height of top/bottom bars; size-vertical is the width of left/right bars.
#   With scale-with-font enabled, these grow/shrink with [font] base-size.
#   scale-with-font = true  # true
#   size-horizontal = 26    # 26, top/bottom bar height at base-size 12
#   size-vertical   = 28    # 28, left/right bar width at base-size 12
# Widget sizes at base-size 12, scaled the same way. Uncomment to change.
#   icon-slot       = 27    # 27, length of one icon slot along the bar
#   icon-canvas     = 16    # 16, the square an icon is drawn in
#   icon-size       = 12    # 12, the icon itself, at most icon-canvas
#   icon-font       = 13    # 13, glyph size of a font icon on an icon button
#   status-slot     = 21    # 21, length of a status indicator slot along the bar

# [spacing]
#   scale           = 1.0               # 1.0
#   scale-with-font = true    # true

[font]
  base-size = 12  # 12
  # caption    = 25  # 10 +15  Notifications / Indicators
  # body-small = 16  # 11 +5   AI icons
  # body       = 17  # 12 +5   Workspace icons
  # subtitle      = 23        # 13 +10
  # title         = 24        # 14 +10
  # heading       = 26        # 16 +10
  # display       = 34        # 24 +10
  # display-large = 38        # 28 +10
  # icon-small    = 21        # 11 +10
  # icon          = 24        # 14 +10
  # icon-large    = 28        # 18 +10
