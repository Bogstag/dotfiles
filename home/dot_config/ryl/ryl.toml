#:schema https://www.schemastore.org/ryl.json

ignore = ["**/modify_*.yml", "**/modify_*.toml"]

[files]
  yaml = [
    "*.yaml",
    "*.yml",
    ".yamllint",
  ]
  markdown = ["**/*.md", "*.mdx"]

[markdown]
  front-matter = true   # lint the --- ... --- block
  fenced-blocks = true  # lint yaml / yml fenced blocks

[rules]
  anchors = "enable"
  braces = "enable"
  brackets = "enable"
  colons = "enable"
  commas = "enable"
  document-end = "disable"
  document-start = "disable"
  empty-lines = "enable"
  empty-values = "disable"
  float-values = "disable"
  hyphens = "enable"
  key-duplicates = "enable"
  key-ordering = "disable"
  new-line-at-end-of-file = "enable"
  new-lines = "enable"
  octal-values = "disable"
  quoted-strings = "disable"
  trailing-spaces = "enable"

[rules.line-length]
  max = 80

[rules.indentation]
  level = "error"
  spaces = 2

[rules.comments]
  level = "error"

[rules.comments-indentation]
  level = "error"

[rules.truthy]
  level = "error"
