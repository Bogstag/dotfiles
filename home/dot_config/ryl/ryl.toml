#:schema https://json.schemastore.org/ryl.json

exclude = ["**/modify_*.yml", "**/modify_*.toml"]

[files]
  markdown = ["**/*.md", "*.mdx"]
  yaml     = ["*.yaml", "*.yml", ".yamllint"]

[lint]
  fixable = ["ALL"]

# tombi: format.rules.table-keys-order = "ascending"
[lint.rules]
  ALL            = "enable"
  document-end   = "disable"
  document-start = "disable"  # default on
  # empty-values = "disable"
  # anchors = "enable"
  # braces = "enable"
  # brackets = "enable"
  # colons = "enable"
  # commas = "enable"
  # empty-lines = "enable"
  # float-values = "disable"
  # hyphens = "enable"
  # key-duplicates = "enable"
  # key-ordering = "enable"   # default disable
  # new-line-at-end-of-file = "enable"
  # new-lines = "enable"
  # octal-values = "disable"
  # quoted-strings = "disable"
  # trailing-spaces = "enable"
  yaml-directive = "disable"

[lint.rules.comments]
  level                   = "error"
  require-starting-space  = true
  ignore-shebangs         = true
  min-spaces-from-content = -1
  max-spaces-from-content = -1

[lint.rules.line-length]
  allow-non-breakable-inline-mappings = true
  allow-non-breakable-words           = true
  level                               = "warning"
  max                                 = 100

[lint.rules.quoted-strings]
  level                            = "error"
  quote-type                       = "double"
  required                         = "only-when-needed"
  extra-required                   = []
  extra-allowed                    = []
  allow-quoted-quotes              = true
  allow-double-quotes-for-escaping = true                # ryl-only
  check-keys                       = false

[lint.rules.truthy]
  allowed-values = ["true", "false", "on"]
  check-keys     = true
  level          = "error"

[format]
  # brace-spacing          = false
  comment-spacing = 1
  # comment-starting-space = "add"
  # dash-on-own-line       = false
  # document-end           = "preserve"
  # document-start         = "preserve"
  # indent-sequences       = true
  # keep-quotes            = false
  # line-ending            = "lf"
  # mapping-expand         = "preserve"
  # mapping-style          = "preserve"
  # max-blank-lines        = 2
  # preview                = false
  # property-order         = "preserve"
  # prose-wrap             = "preserve"
  quote-style     = "double"
  # sequence-expand        = "preserve"
  # sequence-style         = "preserve"

  # [markdown]
