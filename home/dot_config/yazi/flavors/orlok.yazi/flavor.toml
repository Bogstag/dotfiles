#:schema https://yazi-rs.github.io/schemas/theme.json
# vim:fileencoding=utf-8:foldmethod=marker
# Orlok Theme for yazi
#
# [flavor]
# dark  = ""
# light = ""
#
# [app]
# overall = {}

[mgr]
  #
  border_style    = { fg = "#815CD6" }
  # Border
  border_symbol   = "│"
  #
  # Count
  count_copied    = { fg = "#282a36", bg = "#50fa7b" }
  count_cut       = { fg = "#282a36", bg = "#ff5555" }
  count_selected  = { fg = "#282a36", bg = "#f1fa8c" }
  cwd             = { fg = "#8be9fd" }
  #
  # Find
  find_keyword    = { fg = "#f1fa8c", bold = true, italic = true, underline = true }
  find_position   = { fg = "#ff79c6", bg = "reset", bold = true, italic = true }
  #
  # Marker
  marker_copied   = { fg = "#50fa7b", bg = "#50fa7b" }
  marker_cut      = { fg = "#ff5555", bg = "#ff5555" }
  marker_marked   = { fg = "#8be9fd", bg = "#8be9fd" }
  marker_selected = { fg = "#f1fa8c", bg = "#f1fa8c" }
  #
  # Symlink
  symlink_target  = { italic = true }

[tabs]
  active    = { fg = "#FFFFFF", bg = "#815CD6", bold = true }
  inactive  = { fg = "#F8F8F2", bg = "#9a348e", dim = true }
  #
  # Separator
  # sep_inner = { open = "", close = "" }
  # sep_outer = { open = "", close = "" }
  sep_inner = { open = "", close = "" }
  sep_outer = { open = "╰─", close = "" }

[mode]
  normal_alt  = { fg = "#ea4592", bg = "#44475a" }
  normal_main = { fg = "#202025", bg = "#ea4592", bold = true }
  #
  select_alt  = { fg = "#8be9fd", bg = "#44475a" }
  # Select mode
  select_main = { fg = "#202025", bg = "#8be9fd", bold = true }
  #
  unset_alt   = { fg = "#ffb86c", bg = "#44475a" }
  # Unset mode
  unset_main  = { fg = "#202025", bg = "#ffb86c", bold = true }

  # [indicator]
  # parent  = { reversed = true }
  # current = { reversed = true }
  # preview = { underline = true }
  # padding = { open = "", close = "" }

[status]
  # overall   = {}
  # sep_left  = { open = "", close = "" }
  # sep_right = { open = "", close = "" }
  #
  perm_exec       = { fg = "#50fa7b" }
  perm_read       = { fg = "#f1fa8c" }
  # Permissions
  perm_sep        = { fg = "#815CD6" }
  perm_type       = { fg = "#ea4592" }
  perm_write      = { fg = "#ff5555" }
  #
  progress_error  = { fg = "#f1fa8c", bg = "#ff5555" }
  # Progress
  progress_label  = { fg = "#ffffff", bold = true }
  progress_normal = { fg = "#50fa7b", bg = "#63667d" }

[which]
  # cols            = 3
  # mask            = {}
  border          = { fg = "#ea4592" }
  cand            = { fg = "#8be9fd" }
  desc            = { fg = "#ff79c6" }
  rest            = { fg = "#8998c9" }
  separator       = "  "
  separator_style = { fg = "#83869c" }

  # [confirm]
  #   border     = { fg = "blue" }
  #   title      = { fg = "blue" }
  #   body       = {}
  #   list       = {}
  #   btn_yes    = { reversed = true }
  #   btn_no     = {}
  #   btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
  border   = { fg = "#ea4592" }
  tbl_cell = { fg = "#ff79c6", bg = "#63667d" }
  tbl_col  = { fg = "#8be9fd" }
  title    = { fg = "#ea4592" }

  # Table
  #   tbl_col  = { fg = "blue" }
  #   tbl_cell = { fg = "yellow", reversed = true }
  #

[notify]
  title_error = { fg = "#ff5555" }
  title_info  = { fg = "#50fa7b" }
  title_warn  = { fg = "#f1fa8c" }
  #
  # icon_info  = ""
  # icon_warn  = ""
  # icon_error = ""

[pick]
  active   = { fg = "#ff79c6", bold = true }
  border   = { fg = "#ea4592" }
  inactive = {}

[input]
  border   = { fg = "#ea4592" }
  selected = { reversed = true }
  title    = {}
  value    = { fg = "#f8f8f2", bg = "#6272a4", blink = true }

[cmp]
  # active   = { reversed = true }
  # inactive = {}
  border = { fg = "#ea4592" }
  #
  # Icons
  # icon_file    = ""
  # icon_folder  = ""
  # icon_command = ""

[tasks]
  border  = { fg = "#ea4592" }
  hovered = { fg = "#ff79c6", bold = true }
  title   = {}

[help]
  # border  = { fg = "blue" }
  # chord   = { fg = "cyan" }
  # action  = {}
  hovered = { reversed = true, bold = true }

[filetype]
  rules = [
    # Image
    { mime = "**/image/*", fg = "#8be9fd" },
    # Media
    { mime = "**/{audio,video}/*", fg = "#f1fa8c" },                                                            # #bd93f9
    # Application
    {
      mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}",
      fg   = "#b44a95"                                                                                          # Tribute to **R**oshal **AR**chive (RAR)
    },
    { mime = "**/application/{pdf,doc,rtf}", fg = "#50fa7b" },
    # Virtual file system
    { mime = "vfs/{absent,stale}", fg = "#ffffff", bg = "#191A21" },
    #
    # Format
    { mime = "application/json", fg = "#ae72bd" },
    { mime = "application/yaml", fg = "#8be9fd" },
    { mime = "application/xml", fg = "#8be9fd" },
    #
    # Text
    { mime = "text/markdown", fg = "#26a2e4" },
    # Other
    {
      mime = "application/vnd.ms-pki",
      fg   = "#8be9fd",
    },
    {
      mime = "application/x-shellscript",
      fg   = "#50fa7b",
    },
    {
      mime = "application/vnd.sqlite3",
      fg   = "#8be9fd",
    },
    { mime = "application/x-x509-ca-cert", fg = "#ff5555", bold = true },
    {
      mime = "application/x-ipynb+json",
      fg   = "#ff79c6",
    },
    #
    # Special file
    { url = "*", is = "orphan", bg = "#FF5555" },
    { url = "*", is = "link", fg = "#f8f8f2" },
    { url = "*", is = "block", fg = "#cddc39" },
    { url = "*", is = "char", fg = "#cddc39" },
    { url = "*", is = "fifo", fg = "#cddc39" },
    { url = "*", is = "sock", fg = "#cddc39" },
    { url = "*", is = "sticky", fg = "#cddc39" },
    { url = "*", is = "exec", fg = "#50fa7b" },
    #
    # Fallback
    { mime = "*", fg = "#f8f8f2" },
    { mime = "*/", fg = "#ea4592" },
  ]

# Icons are matched according to the following priority:
# globs: glob expressions, e.g., { url = "**/Downloads/*.zip", ... }
# dirs: directory names, e.g., { name = "Desktop", ... }
# files: file names, e.g., { name = ".bashrc", ... }
# exts: extensions, e.g., { name = "mp3", ... }
# conds: conditions, e.g., { if = "!dir", ... }
[icon]
  conds = [
    # Special files
    { if = "orphan", text = "", fg = "#FF5555" },
    { if = "link", text = "", fg = "#f8f8f2" },
    { if = "block", text = "", fg = "#cddc39" },
    { if = "char", text = "", fg = "#cddc39" },
    { if = "fifo", text = "", fg = "#cddc39" },
    { if = "sock", text = "", fg = "#cddc39" },
    { if = "sticky", text = "", fg = "#cddc39" },
    { if = "dummy", text = "", fg = "#ff5555" },
    # Fallback
    { if = "dir & hovered", text = "", fg = "#ea4592" },
    { if = "dir", text = "", fg = "#ea4592" },
    { if = "exec", text = "", fg = "#50fa7b" },
    { if = "!dir", text = "", fg = "#f8f8f2" },
  ]
