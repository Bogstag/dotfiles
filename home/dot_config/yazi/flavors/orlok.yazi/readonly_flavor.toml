#:schema https://yazi-rs.github.io/schemas/theme.json
# vim:fileencoding=utf-8:foldmethod=marker
# Orlok Theme for yazi

# : Manager {{{

[mgr]
  cwd = { fg = "#8be9fd" }

  # Find
  find_keyword  = { fg = "#f1fa8c", bold = true, italic = true, underline = true }
  find_position = { fg = "#ff79c6", bg = "reset", bold = true, italic = true }

  # Marker
  marker_copied   = { fg = "#50fa7b", bg = "#50fa7b" }
  marker_cut      = { fg = "#ff5555", bg = "#ff5555" }
  marker_marked   = { fg = "#8be9fd", bg = "#8be9fd" }
  marker_selected = { fg = "#f1fa8c", bg = "#f1fa8c" }

  # Count
  count_copied   = { fg = "#202025", bg = "#50fa7b" }
  count_cut      = { fg = "#202025", bg = "#ff5555" }
  count_selected = { fg = "#202025", bg = "#f1fa8c" }

  # Border
  border_symbol = "│"
  border_style  = { fg = "#7282b5" }

  # : }}}

  # : Tabs {{{

[tabs]
  active   = { fg = "#202025", bg = "#ea4592", bold = true }
  inactive = { fg = "#ea4592", bg = "#44475a" }

  # : }}}

  # : Mode {{{

[mode]
  normal_main = { fg = "#202025", bg = "#ea4592", bold = true }
  normal_alt  = { fg = "#ea4592", bg = "#44475a" }

  # Select mode
  select_main = { fg = "#202025", bg = "#8be9fd", bold = true }
  select_alt  = { fg = "#8be9fd", bg = "#44475a" }

  # Unset mode
  unset_main = { fg = "#202025", bg = "#ffb86c", bold = true }
  unset_alt  = { fg = "#ffb86c", bg = "#44475a" }

  # : }}}

  # : Status bar {{{

[status]
  # Permissions
  perm_sep   = { fg = "#7282b5" }
  perm_type  = { fg = "#ea4592" }
  perm_read  = { fg = "#f1fa8c" }
  perm_write = { fg = "#ff5555" }
  perm_exec  = { fg = "#50fa7b" }

  # Progress
  progress_label  = { fg = "#ffffff", bold = true }
  progress_normal = { fg = "#50fa7b", bg = "#63667d" }
  progress_error  = { fg = "#f1fa8c", bg = "#ff5555" }

  # : }}}

  # : Pick {{{

[pick]
  border   = { fg = "#ea4592" }
  active   = { fg = "#ff79c6", bold = true }
  inactive = {}

  # : }}}

  # : Input {{{

[input]
  border   = { fg = "#ea4592" }
  title    = {}
  value    = { fg = "#f8f8f2", bg = "#6272a4", blink = true }
  selected = { reversed = true }

  # : }}}

  # : Completion {{{

[cmp]
  border = { fg = "#ea4592" }

  # : }}}

  # : Tasks {{{

[tasks]
  border  = { fg = "#ea4592" }
  title   = {}
  hovered = { fg = "#ff79c6", bold = true }

  # : }}}

  # : Which {{{

[which]
  border          = { fg = "#ea4592" }
  cand            = { fg = "#8be9fd" }
  rest            = { fg = "#8998c9" }
  desc            = { fg = "#ff79c6" }
  separator       = "  "
  separator_style = { fg = "#83869c" }

  # : }}}

  # : Help {{{

[help]
  # on      = { fg = "#8be9fd" }
  # run     = { fg = "#ff79c6" }
  hovered = { reversed = true, bold = true }
  # footer  = { fg = "#44475a", bg = "#f8f8f2" }

  # : }}}

  # : Spotter {{{

[spot]
  border   = { fg = "#ea4592" }
  title    = { fg = "#ea4592" }
  tbl_col  = { fg = "#8be9fd" }
  tbl_cell = { fg = "#ff79c6", bg = "#63667d" }

  # : }}}

  # : Notification {{{

[notify]
  title_info  = { fg = "#50fa7b", bg = "#282a36" }
  title_warn  = { fg = "#f1fa8c", bg = "#282a36" }
  title_error = { fg = "#ff5555", bg = "#282a36" }

  # : }}}

  # : File-specific styles {{{

[filetype]
  rules = [
    {
      mime = "application/yaml",
      fg   = "#8be9fd",
      bold = true,
    },
    {
      mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}",
      fg   = "#50fa7b"
    },
    { url = "application/vnd.ms-pki", fg = "#8be9fd", italic = false },

    { mime = "application/x-shellscript", fg = "#50fa7b", italic = false },
    { url = "application/vnd.sqlite3", fg = "#8be9fd", italic = false },
    { mime = "application/x-x509-ca-cert", fg = "#ff5555", bold = true },
    { mime = "application/x-ipynb+json", fg = "#ff79c6", italic = false },
    { url = "application/{json,yaml,xml}", fg = "#8be9fd", italic = false },
    { mime = "**/application/{pdf,doc,rtf}", fg = "#8be9fd" },

    # Media
    { mime = "video/*", fg = "#bd93f9" },
    { mime = "**/image/*", fg = "#8be9fd" },
    { mime = "image/{jpg,jpeg,png,gif}", fg = "#8be9fd" },

    { mime = "audio/*", fg = "#bd93f9" },

    # Virtual file system
    { mime = "vfs/{absent,stale}", fg = "#8998c9" },
    # Font
    { mime = "font/{otf,woff,woff2}", fg = "#ff79c6", italic = false },
    { mime = "application/x-font-ttf", fg = "#ff79c6", italic = false },
    # Text
    { url = "text/markdown", fg = "#6272a4" },
    { url = "text/x-python", fg = "#50fa7b" },
    { url = "text/x-c", fg = "#6272a4" },
    { url = "text/uri-list", fg = "#6272a4" },
    { url = "text/troff", fg = "#6272a4" },
    { url = "text/tab-separated-values", fg = "#6272a4" },
    { url = "text/plain", fg = "#6272a4" },
    { url = "text/javascript", fg = "#f1fa8c" },
    { url = "text/html", fg = "#ff79c6" },
    { mime = "text/csv", fg = "#50fa7b", italic = false },
    { url = "text/css", fg = "#bd93f9" },
    { url = "text/calendar", fg = "#6272a4" },
    { url = "text/x-asm", fg = "#ff5555", italic = false },
    # Fallback
    { mime = "*", fg = "#f8f8f2" },
    { mime = "*/", fg = "#ea4592" },
  ]

  # : }}}

[icon]
  conds = [
    # Special files
    { if = "orphan", text = "", fg = "#f8f8f2" },
    { if = "link", text = "", fg = "#7282b5" },
    { if = "block", text = "", fg = "#ffb86c" },
    { if = "char", text = "", fg = "#ffb86c" },
    { if = "fifo", text = "", fg = "#ffb86c" },
    { if = "sock", text = "", fg = "#ffb86c" },
    { if = "sticky", text = "", fg = "#ffb86c" },
    { if = "dummy", text = "", fg = "#ff5555" },

    # Fallback
    { if = "dir & hovered", text = "", fg = "#ea4592" },
    { if = "dir", text = "", fg = "#ea4592" },
    { if = "exec", text = "", fg = "#50fa7b" },
    { if = "!dir", text = "", fg = "#f8f8f2" },
  ]
