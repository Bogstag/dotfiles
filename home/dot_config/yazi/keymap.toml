#:schema https://yazi-rs.github.io/schemas/keymap.json
# default file://$HOME/.config/yazi/keymap-default.toml
# Kay Modifiers
# <S-…>	Shift key.
# <C-…>	Ctrl key.
# <A-…>	Alt key.
# <D-…>	Windows/Super key.

[mgr]
  prepend_keymap = [
    # Plugins
    { on = ["c", "m"], run = "plugin chmod", desc = "" },
    {
      on = "l",
      run = "plugin smart-enter",
      desc = "Enter the child directory, or open the file"
    },
    {
      on = ["C", "d"],
      run = "plugin diff",
      desc = "Diff the selected with the hovered file"
    },
    { on = "f", run = "plugin smart-filter", desc = "Smart filter" },
    {
      on = "p",
      run = "plugin smart-paste",
      desc = "Paste into the hovered directory or CWD"
    },
    {
      for = "windows",
      on = "!",
      run = "shell 'powershell.exe' --block",
      desc = "Open PowerShell here"
    },
    {
      for = "unix",
      on = "!",
      run = 'shell "$SHELL" --block',
      desc = "Open $SHELL here",
    },

    # Goto
    { on = ["g", "l"], run = "cd ~/.local", desc = "Go to ~/.local" },
    { on = ["g", "p"], run = "cd ~/Projects", desc = "Go to ~/Projects" },
    { on = ["g", "w"], run = "cd ~/Work", desc = "Go to ~/Work" },

    # Templates
    # { on = "", run = "", desc = "" },
    # { for = "windows", on = "", run = "", desc = "" },
  ]

  # TODO: https://yazi-rs.github.io/docs/tips#smart-tab
  # TODO: https://yazi-rs.github.io/docs/tips#smart-switch
  # TODO: https://github.com/yazi-rs/plugins/tree/main/toggle-pane.yazi
