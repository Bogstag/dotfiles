#:schema https://mise.jdx.dev/schema/mise.json

[env]
  GOBIN          = "${GOROOT:/home/bogge/.local/share/mise/installs/go/latest}/bin"  # The directory where 'go install' will install a command.
  GOENV          = "${XDG_CONFIG_HOME:-$HOME/.config}/go/env"                        # The location of the Go environment configuration file.
  GOROOT         = "/home/bogge/.local/share/mise/installs/go/latest"                # Controls where various files are stored. See: 'go help gopath'.
  GOTELEMETRY    = "off"
  GOTELEMETRYDIR = "${XDG_CONFIG_HOME:-$HOME/.config}/go/telemetry"                  # The directory Go telemetry data is written is written to.
  HK_MISE        = 1                                                                 # The current Go telemetry mode ("off", "local", or "on").
  _.path         = [
    "go/bin",
    ".bin",
    "/home/bogge/.local/share/mise/installs/go/latest/bin",
  ]

[settings]
  color_theme        = "dracula"
  experimental       = true
  lockfile           = false
  upgrade.auto_prune = false

[settings.github]
  credential_command  = "gh auth token"
  use_git_credentials = true

[settings.go]
  # set_goroot = true  # The root of the go tree. GOROOT='/home/bogge/.local/share/mise/installs/go/1.27.2'
  # set_gobin = true   # GOBIN='/home/bogge/.local/share/mise/installs/go/1.27.2/bin'

[settings.packslip]
  exec = false

[settings.skills]
  dir       = ".agents/skills"
  auto_sync = false
  prune     = true

[settings.status]
  show_env   = false
  show_tools = false

[task_config]
  includes = ["tasks.toml"]

[tools]
  age                                = "latest"
  "aqua:Kampfkarren/selene"          = "latest"
  "aqua:owenlamont/ryl"              = "latest"
  betterleaks                        = "latest"
  bitwarden-secrets-manager          = "latest"
  codegraph                          = "latest"
  codex                              = "latest"
  copilot                            = "latest"
  crush                              = "latest"
  editorconfig-checker               = "latest"
  fnox                               = { version = "latest", workflow = "release.yml" }
  gemini                             = {
    version      = "latest",
    allow_builds = [
      "@github/keytar",
      "node-pty",
    ]
  }
  gh                                 = "latest"
  "github:daptify14/chezit"          = { version = "latest", os = ["linux"] }
  "go:github.com/gohugoio/gotmplfmt" = "latest"
  hk                                 = { version = "latest", workflow = "release.yml" }
  hunk                               = "latest"
  java                               = "latest"
  lua                                = "latest"
  lua-language-server                = "latest"
  node                               = ["lts", "26"]
  "npm:@masculinecache/mem-axi"      = "latest"
  opencode                           = "latest"
  oxfmt                              = "latest"
  oxlint                             = "latest"
  pi                                 = "latest"
  pkl                                = "latest"
  playwright                         = "latest"
  python                             = "latest"
  resvg                              = "latest"
  ripgrep                            = "latest"
  shellcheck                         = "latest"
  shellharden                        = "latest"
  shfmt                              = "latest"
  stylua                             = "latest"
  tombi                              = "latest"
  uv                                 = "latest"
  yazi                               = "latest"
  vp                                 = "latest"
  7zip                               = "latest"
  rust                               = "latest"
  cargo-binstall                     = "latest"
  "cargo:keybinds-tui"               = { version = "latest", bin = "kb" }
