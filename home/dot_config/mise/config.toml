#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[settings]
  upgrade.auto_prune = false
  experimental = true
  color_theme = "dracula"
  lockfile = false

[settings.packslip]
  exec = true

  # [settings.github]
  # credential_command = "gh auth token"
  # use_git_credentials = true

[settings.skills]
  dir = ".agents/skills"
  auto_sync = true
  prune = true

[task_config]
  includes = ["tasks.toml"]

# tombi: format.rules.table-keys-order = "ascending"
[tools]
  "aqua:owenlamont/ryl" = "latest"
  betterleaks = "latest"
  biome = "latest"
  bitwarden-secrets-manager = "latest"
  codegraph = "latest"
  codex = "latest"
  copilot = "latest"
  crush = "latest"
  editorconfig-checker = "latest"
  gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
  gh = "latest"
  "github:daptify14/chezit" = { version = "latest", os = ["linux"] }
  go = "latest"
  "go:github.com/gohugoio/gotmplfmt" = "latest"
  hk = "latest"
  hunk = "latest"
  java = "latest"
  lua = "latest"
  node = "26.7.0"
  "npm:@masculinecache/mem-axi" = "latest"
  opencode = "latest"
  oxfmt = "latest"
  oxlint = "latest"
  pi = "latest"
  pkl = "latest"
  playwright = "latest"
  python = "latest"
  resvg = "latest"
  rg = "latest"
  ripgrep = "latest"
  shellcheck = "latest"
  shellharden = "latest"
  shfmt = "latest"
  tombi = "latest"
  uv = "latest"
  vp = "latest"
  yazi = "latest"
