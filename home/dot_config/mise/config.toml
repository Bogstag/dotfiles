#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[bootstrap.mise_shell_activate]
  bash = true

[env]
  _.path    = [
    "${GOPATH:-$HOME/go}",
    ".bin",
    ".lib",
    "/home/bogge/.lib/qt6/bin",
    "/home/bogge/.local/share/mise/installs/go/latest/bin",
  ]
  HK_MISE   = 1
  UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
  color_theme                         = "dracula"
  experimental                        = true
  lockfile                            = false
  minimum_release_age                 = "1d"
  upgrade.auto_prune                  = false
  idiomatic_version_file_enable_tools = [
    "chezmoi",
    "go",
    "golangci-lint",
    "goreleaser",
    "node",
    "npm",
    "opentofu",
    "pre-commit",
    "python",
    "ruff",
    "terraform",
  ]

[settings.github]
  credential_command  = "gh auth token"
  use_git_credentials = true

[settings.go]
  set_gobin  = false
  set_goroot = true

[settings.packslip]
  exec = true

[settings.skills]
  auto_sync = true
  dir       = ".agents/skills"
  fetch     = true
  prune     = true

[settings.status]
  show_env   = false
  show_tools = false

[task_config]
  includes = ["tasks.toml"]

[tool_alias]
  go          = "core:go"
  java        = "core:java"
  node        = "core:node"
  python      = "core:python"
  rust        = "core:rust"
  #
  dagu        = "packslip:dagucloud/dagu"
  fnox        = "packslip:jdx/fnox"
  hk          = "packslip:jdx/hk"
  jactionlint = "packslip:jdx/jactionlint"
  jouet       = "packslip:jdx/jouet"
  pitchfork   = "packslip:jdx/pitchfork"
  worktrunk   = "packslip:max-sixty/worktrunk"

[tools]
  "aqua:Kampfkarren/selene"     = "latest"
  "aqua:owenlamont/ryl"         = "latest"
  "github:daptify14/chezit"     = { version = "latest", os = ["linux"] }
  "github:microsoft/apm"        = "latest"
  "go:golang.org/x/tools/gopls" = "latest"
  "npm:markdownlint-cli"        = "latest"
  7zip                          = "latest"
  age                           = "latest"
  betterleaks                   = "latest"
  bitwarden-secrets-manager     = "latest"
  cargo-binstall                = "latest"
  codegraph                     = "latest"
  dagu                          = "latest"
  editorconfig-checker          = "latest"
  fnox                          = "latest"
  go                            = "latest"
  hk                            = "latest"
  jactionlint                   = "latest"
  java                          = "latest"
  jouet                         = "latest"
  lua                           = "latest"
  lua-language-server           = "latest"
  node                          = ["lts", "26"]
  oxfmt                         = "latest"
  oxlint                        = "latest"
  pitchfork                     = "latest"
  pkl                           = "latest"
  python                        = "latest"
  resvg                         = "latest"
  ripgrep                       = "latest"
  rust                          = "latest"
  shellcheck                    = "latest"
  shellharden                   = "latest"
  shfmt                         = "latest"
  stylua                        = "latest"
  tombi                         = "latest"
  uv                            = "latest"
  vp                            = "latest"
  worktrunk                     = "latest"
  yazi                          = "latest"
  "cargo:chezmoi-tui"           = "latest"
