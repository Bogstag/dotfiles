#:schema https://mise.jdx.dev/schema/mise.json

[env]
  _.path    = [
    "${GOPATH:-$HOME/go}",
    ".bin",
    ".lib",
    "/home/bogge/.lib/qt6/bin",
    "/home/bogge/.local/share/mise/installs/go/latest/bin",
  ]
  HK_MISE   = 1
  UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[bootstrap.mise_shell_activate]
  bash = true

[settings]
  color_theme                         = "dracula"
  experimental                        = true
  lockfile                            = false
  minimum_release_age                 = "1d"
  upgrade.auto_prune                  = false
  idiomatic_version_file_enable_tools = [
    "chezmoi",
    "go",
    "golangci-lint",
    "goreleaser",
    "node",
    "npm",
    "opentofu",
    "pre-commit",
    "python",
    "ruff",
    "terraform",
  ]

[settings.go]
  set_gobin  = false
  set_goroot = true

[settings.github]
  credential_command  = "gh auth token"
  use_git_credentials = true

[settings.packslip]
  exec = false

[settings.skills]
  auto_sync = false
  dir       = ".agents/skills"
  prune     = true

[settings.status]
  show_env   = false
  show_tools = false

[task_config]
  includes = ["tasks.toml"]

[tools]
  "aqua:Kampfkarren/selene"     = "latest"
  "aqua:owenlamont/ryl"         = "latest"
  "github:daptify14/chezit"     = { version = "latest", os = ["linux"] }
  "go:golang.org/x/tools/gopls" = "latest"
  "npm:@masculinecache/mem-axi" = "latest"
  7zip                          = "latest"
  age                           = "latest"
  betterleaks                   = "latest"
  bitwarden-secrets-manager     = "latest"
  cargo-binstall                = "latest"
  codegraph                     = "latest"
  editorconfig-checker          = "latest"
  fnox                          = { version = "latest", workflow = "release.yml" }
  go                            = "latest"
  hk                            = { version = "latest", workflow = "release.yml" }
  java                          = "latest"
  lua                           = "latest"
  lua-language-server           = "latest"
  node                          = ["lts", "26"]
  oxfmt                         = "latest"
  oxlint                        = "latest"
  pkl                           = "latest"
  python                        = "latest"
  resvg                         = "latest"
  ripgrep                       = "latest"
  rust                          = "latest"
  shellcheck                    = "latest"
  shellharden                   = "latest"
  shfmt                         = "latest"
  stylua                        = "latest"
  tombi                         = "latest"
  uv                            = "latest"
  vp                            = "latest"
  yazi                          = "latest"
  "npm:markdownlint-cli"        = "latest"
