#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[bootstrap.mise_shell_activate]
  bash = true

[env]
  _.path                         = [
    "${GOPATH:-$HOME/go}",
    ".bin",
    ".lib",
    "/home/bogge/.lib/qt6/bin",
    "/home/bogge/.local/share/mise/installs/go/latest/bin",
  ]
  HK_MISE                        = 1
  UV_PYTHON                      = { value = "{{ tools.python.path }}", tools = true }
  VP_SETUP_NODE_VERSION          = "26"
  VP_PM_MANAGER                  = "yes"
  MISE_COMPLETIONS_SYNC_BASH_DIR = "$XDG_DATA_HOME/bash-completion/completions"

[hooks]
  postinstall = "misecompsync --shell bash --new-only"

[settings]
  color_theme                         = "dracula"
  experimental                        = true
  lockfile                            = false
  minimum_release_age                 = "1d"
  upgrade.auto_prune                  = false
  idiomatic_version_file_enable_tools = [
    "chezmoi",
    "go",
    "golangci-lint",
    "goreleaser",
    "node",
    "npm",
    "opentofu",
    "pre-commit",
    "python",
    "ruff",
    "terraform",
  ]

[settings.github]
  credential_command  = "gh auth token"
  use_git_credentials = true

[settings.go]
  set_gobin  = false
  set_goroot = true

[settings.packslip]
  exec = true

[settings.skills]
  auto_sync = true
  dir       = ".agents/skills"
  fetch     = true
  prune     = true

[settings.status]
  show_env   = false
  show_tools = false

[task_config]
  includes = ["tasks.toml"]

[tool_alias]
  go          = "core:go"
  java        = "core:java"
  node        = "core:node"
  python      = "core:python"
  rust        = "core:rust"
  #
  dagu        = "packslip:dagucloud/dagu"
  fnox        = "packslip:jdx/fnox"
  hk          = "packslip:jdx/hk"
  jactionlint = "packslip:jdx/jactionlint"
  jouet       = "packslip:jdx/jouet"
  pitchfork   = "packslip:jdx/pitchfork"
  worktrunk   = "packslip:max-sixty/worktrunk"

[tools]
  "aqua:Kampfkarren/selene"               = "latest"
  "aqua:owenlamont/ryl"                   = "latest"
  "cargo:chezmoi-tui"                     = "latest"
  "github:alltuner/mise-completions-sync" = "latest"
  "github:daptify14/chezit"               = { version = "latest", os = ["linux"] }
  "github:github/gh-actions-lock"         = { version = "latest", bin = "gh-actions-lock" }
  "github:ivankovic/omnidiff"             = "latest"
  "github:microsoft/apm"                  = "latest"
  "go:golang.org/x/tools/gopls"           = "latest"
  "npm:markdownlint-cli"                  = "latest"
  7zip                                    = "latest"
  age                                     = "latest"
  betterleaks                             = "latest"
  bitwarden-secrets-manager               = "latest"
  cargo-binstall                          = "latest"
  codegraph                               = "latest"
  cspell                                  = "latest"
  dagu                                    = "latest"
  editorconfig-checker                    = "latest"
  fnox                                    = "latest"
  go                                      = "latest"
  hk                                      = "latest"
  jactionlint                             = "latest"
  java                                    = "latest"
  lua                                     = "latest"
  lua-language-server                     = "latest"
  node                                    = ["lts"]
  oxfmt                                   = "latest"
  oxlint                                  = "latest"
  pitchfork                               = "latest"
  pkl                                     = "latest"
  python                                  = "latest"
  resvg                                   = "latest"
  ripgrep                                 = "latest"
  rust                                    = "latest"
  shdoc                                   = "latest"
  shellcheck                              = "latest"
  shellharden                             = "latest"
  shfmt                                   = "latest"
  stylua                                  = "latest"
  tombi                                   = "latest"
  typos                                   = "latest"
  uv                                      = "latest"
  worktrunk                               = "latest"
  yazi                                    = "latest"
