#:schema https://mise.jdx.dev/schema/mise-task.json
# file:///home/bogge/.config/mise/tasks/tasks.toml

[check]
  depends     = ["check:*"]
  description = "Run all checks"

[fix]
  depends     = ["fix:*"]
  description = "Run all fixes"

[uv-global-install]
  # To uninstall replace install with uninstall
  description = "Install pkg with exec globally"
  run         = "uv tool install"

["sync_global_skills"]
  description = "Add or update global skills"
  run         = "mise skills sync --global"

["update_bash_completions"]
  description = "Source: https://mise-completions.alltuner.com/"
  run         = "misecompsync --shell bash"

["Update_external_markdown"]
  description = "Re add external md files"
  run         = [
    "chezmoi re-add ~/.config/yazi/plugins/*/{README,readme}.md",
    "chezmoi re-add ~/.config/omarchy/plugins/*/{CHANGELOG,DESIGN,README,changelog,design,readme}.md",
    "chezmoi re-add ~/.config/omarchy/plugins/*/preview.png",
  ]
