"$schema" = "https://starship.rs/config-schema.json"

# Use the color palette
palette = "dracula"

# add_newline = false
command_timeout = 200
scan_timeout = 10
continuation_prompt = "▶▶ "

# [░▒▓](#a3aed2)\ [](purple)\
format = """
[](purple)\
$os\
[](bg:cyan fg:purple)\
$directory\
[](bg:pink fg:cyan)\
$git_branch\
$git_status\
[](fg:pink bg:green)\
$nodejs\
$golang\
$python\
$docker_context\
$terraform\
[](fg:green bg:comment)\
$mise\
[](fg:comment bg:comment)\
$time\
[ ](fg:comment)\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "bg:purple fg:crust"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = "󰣇"
Windows = "󰍲"

[directory]
style = "bg:cyan fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = " "
Pictures = " "
Projects = "󰲋 "

[git_branch]
symbol = ""
style = "bg:pink"
format = "[[ $symbol $branch ](fg:crust bg:pink)]($style)"

[git_status]
style = "bg:pink"
format = "[[($all_status$ahead_behind )](fg:crust bg:pink)]($style)"

[nodejs]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[golang]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[docker_context]
symbol = ""
style = "bg:comment"
format = "[[ $symbol( $context) ](fg:crust bg:comment)]($style)"

[mise]
disabled = false
style = "fg:crust bg:comment"
format = "[on $symbol$health]($style)"

[terraform]
disabled = false
style = "bg:comment"
format = "[via $symbol$workspace]($style)"

[time]
disabled = false
time_format = "%_I:%M %p"
style = "bg:comment"
format = "[[  $time ](fg:crust bg:comment)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[❯](bold fg:green)"
error_symbol = "[x](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
vimcmd_replace_one_symbol = "[❮](bold fg:purple)"
vimcmd_replace_symbol = "[❮](bold fg:purple)"
vimcmd_visual_symbol = "[❮](bold fg:yellow)"

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:purple"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.dracula]
pink = "#ff79c6"
red = "#ff5555"
yellow = "#f1fa8c"
green = "#50fa7b"
blue = "#644ac9"
purple = "#bd93f9"
cyan = "#8be9fd"
comment = "#6272a4"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
