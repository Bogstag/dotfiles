#:schema https://starship.rs/config-schema.json
# tombi: format.rules.table-keys-order = "ascending"

# Use the color palette
palette = "dracula"

# add_newline = false
command_timeout     = 200
continuation_prompt = "▶▶ "
scan_timeout        = 10

# Icons ple
#                              
#                              
#
#       
#
# ╰ ─  ░▒▓ ▓▒░  ▁▂▃▄▅▆▇█ ▉▊▋▌▍▍▎▏▐  ▏▎▍▌▋▊▉
#
#                      
#
#         l  ∟ ╰
#
#              
#
#   󰯉  ⬬
# [ ▒▓] 
# [ ░▒▓](#a3aed2)\ [](purple)\
format = """
[](fg:crust bg:blue)\
$shell\
${env_var.yazi_level}\
[](fg:blue bg:purple)\
$os\
[](fg:purple bg:cyan)\
$directory\
[](fg:cyan bg:pink)\
$git_branch\
$git_status\
[](fg:pink bg:comment)\
$nodejs\
$golang\
$python\
$docker_context\
$terraform\
[](fg:comment bg:pink)\
$mise\
[](fg:pink bg:red)\
$jobs\
[](fg:red bg:red)\
$cmd_duration\
[](fg:red bg:comment)\
$time\
[](fg:comment bg:crust)\
$line_break\
[╰](bold fg:blue)\
$character"""

[aws]
  disabled = true

[battery]
  disabled = true

[bun]
  disabled = true

[c]
  disabled = true

[character]
  disabled                  = false
  error_symbol              = "[x](bold fg:red)"
  success_symbol            = "[❯](bold fg:green)"
  vimcmd_replace_one_symbol = "[❮](bold fg:purple)"
  vimcmd_replace_symbol     = "[❮](bold fg:purple)"
  vimcmd_symbol             = "[❮](bold fg:green)"
  vimcmd_visual_symbol      = "[❮](bold fg:yellow)"

[cmd_duration]
  disabled           = false
  format             = "[  in $duration ]($style)"
  min_time_to_notify = 45000
  show_milliseconds  = false
  show_notifications = false
  style              = "bg:red fg:crust"

[directory]
  format            = "[ $path ]($style)"
  style             = "bg:cyan fg:crust"
  truncation_length = 10
  truncation_symbol = "…/"

# tombi: format.rules.table-keys-order = "ascending"
[directory.substitutions]
  ".cache"           = "󰃨"
  ".config"          = ""
  ".data"            = "󱙋"
  ".dotfies"         = ""
  ".dotnet"          = "󰪮"
  ".git"             = ""
  ".nuget"           = ""
  ".ssh"             = "󰣀"
  ".vscode"          = ""
  ".vscode-insiders" = ""
  API                = "󱂛"
  Ansible            = ""
  Astro              = ""
  Desktop            = ""
  Docker             = ""
  Documents          = "󰈙 "
  Downloads          = " "
  Links              = ""
  Music              = " "
  Perl               = ""
  Pictures           = " "
  PowerShell         = "_"
  Projects           = "󰲋 "
  Python             = ""
  Scoop              = ""
  Sync               = "󱈖"
  SyncB              = "󱦕"
  Ubuntu             = "󰕈"
  bash               = ""
  cloudflare         = ""
  dbeaver            = ""
  dev                = ""
  eleventy           = ""
  eslint             = ""
  git                = ""
  javascript         = ""
  json               = ""
  less               = ""
  linux              = ""
  markdown           = ""
  md                 = ""
  nginx              = ""
  node               = ""
  npm                = ""
  nppWorkspace       = "󰎞"
  nuxt               = ""
  repos              = ""
  ssh                = "󰣀"
  unicode            = "󰻐"
  vite               = ""
  vitejs             = ""
  vitess             = ""
  vitest             = ""
  vscode             = ""
  vscode-insider     = ""
  vue                = ""
  vuejs              = ""
  vuetify            = ""
  windows            = ""

[docker_context]
  format = "[[$symbol( $context)](fg:crust bg:comment)]($style)"
  style  = "bg:comment"

[elixir]
  disabled = true

[env_var.yazi_level]
  description = "Indicate the shell was launched by `yazi`"
  variable    = "YAZI_LEVEL"
  style       = "bg:blue fg:crust"
  # 🦆: U+1f986 Duck
  # Alternatively: " ": U+E795 <Private Use>
  symbol      = " "
  format      = "[ $symbol ]($style)"

[fill]
  symbol = " "

[git_branch]
  format = "[[ $symbol $branch](fg:crust bg:pink)]($style)"
  style  = "bg:pink"
  symbol = ""

[git_status]
  ahead     = "⇡ ${count} "
  behind    = "⇣ ${count} "
  deleted   = " ${count} "
  format    = "[[ $all_status $ahead_behind](fg:crust bg:pink)]($style)"
  modified  = " ${count} "
  staged    = " ${count} "
  style     = "bg:pink"
  untracked = " ${count} "

[golang]
  format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"
  style  = "bg:green"
  symbol = ""

[jobs]
  format           = "[ $symbol $number](fg:crust bg:comment)]($style)"
  number_threshold = 1
  style            = "bg:cyan"
  symbol           = "󰒓"
  symbol_threshold = 1

[line_break]
  disabled = false

[mise]
  disabled         = false
  format           = "[ $symbol $health ]($style)"
  healthy_symbol   = ""
  style            = "fg:crust bg:pink"
  symbol           = "󰭼"
  unhealthy_symbol = ""

[nodejs]
  format = "[[ $symbol( $version) ](fg:green bg:comment)]($style)"
  # style  = "bg:comment"
  symbol = ""

[os]
  disabled = false
  format   = "[ $symbol ]($style)"
  style    = "bg:purple fg:crust"

[os.symbols]
  Alpine   = ""
  Arch     = "󰣇"
  Raspbian = "󰐿"
  Ubuntu   = "󰕈"
  Windows  = "󰍲"

[palettes.dracula]
  base    = "#1e1e2e"
  blue    = "#644ac9"
  comment = "#6272a4"
  crust   = "#262935"
  cyan    = "#8be9fd"
  green   = "#50fa7b"
  mantle  = "#181825"
  pink    = "#ff79c6"
  purple  = "#bd93f9"
  red     = "#ff5555"
  yellow  = "#f1fa8c"

  # Orginal
  # crust = "#11111b"

[python]
  format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'
  style  = "bg:green"
  symbol = ""

[shell]
  bash_indicator       = "󱆃"
  cmd_indicator        = ""
  disabled             = false
  format               = "[ $indicator ]($style)"
  powershell_indicator = ""
  pwsh_indicator       = "_"
  style                = "bg:blue fg:crust"
  unknown_indicator    = ""

[terraform]
  disabled = false
  format   = "[via $symbol$workspace]($style)"
  style    = "bg:comment"

[time]
  disabled    = false
  format      = "[[  $time ](fg:crust bg:comment)]($style)"
  style       = "bg:comment"
  time_format = "%H:%M"

[username]
  disabled = true
