#:schema https://starship.rs/config-schema.json
# tombi: format.rules.table-keys-order = "ascending"

# Use the color palette
palette = "dracula"

# add_newline = false
command_timeout = 200
continuation_prompt = "▶▶ "
scan_timeout = 10

# Icons ple
#                              
#                              
#
#       
#
# ╰ ─  ░▒▓ ▓▒░  ▁▂▃▄▅▆▇█ ▉▊▋▌▍▍▎▏▐  ▏▎▍▌▋▊▉
#
#                      
#
#         l  ∟ ╰
#
#              
#
#   󰯉  ⬬
# [ ▒▓] 
# [ ░▒▓](#a3aed2)\ [](purple)\
format = """
[](bg:blue fg:crust)\
$shell\
${env_var.yazi_level}\
[](bg:purple fg:blue)\
$os\
[](bg:cyan fg:purple)\
$directory\
[](bg:pink fg:cyan)\
$git_branch\
$git_status\
[](fg:pink bg:pink)\
$nodejs\
$golang\
$python\
$docker_context\
$terraform\
[](fg:pink bg:crust)\
$fill\
[](fg:crust bg:pink)\
$mise\
[](fg:pink bg:red)\
$jobs\
[](fg:red bg:red)\
$cmd_duration\
[](fg:red bg:comment)\
$time\
[](fg:comment bg:crust)\
$line_break\
[╰](bold fg:blue)\
$character"""

[aws]
  disabled = true

[battery]
  disabled = true

[bun]
  disabled = true

[c]
  disabled = true

[character]
  disabled = false
  success_symbol = "[❯](bold fg:green)"
  error_symbol = "[x](bold fg:red)"
  vimcmd_symbol = "[❮](bold fg:green)"
  vimcmd_replace_one_symbol = "[❮](bold fg:purple)"
  vimcmd_replace_symbol = "[❮](bold fg:purple)"
  vimcmd_visual_symbol = "[❮](bold fg:yellow)"

[cmd_duration]
  show_milliseconds = false
  format = "[  in $duration ]($style)"
  style = "bg:red fg:crust"
  disabled = false
  show_notifications = false
  min_time_to_notify = 45000

[directory]
  style = "bg:cyan fg:crust"
  format = "[ $path ]($style)"
  truncation_length = 10
  truncation_symbol = "…/"

# tombi: format.rules.table-keys-order = "ascending"
[directory.substitutions]
  ".cache" = "󰃨"
  ".config" = ""
  ".data" = "󱙋"
  ".dotfies" = ""
  ".dotnet" = "󰪮"
  ".git" = ""
  ".nuget" = ""
  ".ssh" = "󰣀"
  ".vscode" = ""
  ".vscode-insiders" = ""
  API = "󱂛"
  Ansible = ""
  Astro = ""
  Desktop = ""
  Docker = ""
  Documents = "󰈙 "
  Downloads = " "
  Links = ""
  Music = " "
  Perl = ""
  Pictures = " "
  PowerShell = "_"
  Projects = "󰲋 "
  Python = ""
  Scoop = ""
  Sync = "󱈖"
  SyncB = "󱦕"
  Ubuntu = "󰕈"
  bash = ""
  cloudflare = ""
  dbeaver = ""
  dev = ""
  eleventy = ""
  eslint = ""
  git = ""
  javascript = ""
  json = ""
  less = ""
  linux = ""
  markdown = ""
  md = ""
  nginx = ""
  node = ""
  npm = ""
  nppWorkspace = "󰎞"
  nuxt = ""
  repos = ""
  ssh = "󰣀"
  unicode = "󰻐"
  vite = ""
  vitejs = ""
  vitess = ""
  vitest = ""
  vscode = ""
  vscode-insider = ""
  vue = ""
  vuejs = ""
  vuetify = ""
  windows = ""

[docker_context]
  style = "bg:comment"
  format = "[[$symbol( $context)](fg:crust bg:comment)]($style)"

[elixir]
  disabled = true

[env_var.yazi_level]
  description = "Indicate the shell was launched by `yazi`"
  variable = "YAZI_LEVEL"
  style = "bg:blue fg:crust"
  # 🦆: U+1f986 Duck
  # Alternatively: " ": U+E795 <Private Use>
  symbol = " "
  format = "[ $symbol ]($style)"

[fill]
  symbol = " "

[git_branch]
  symbol = ""
  style = "bg:pink"
  format = "[[$symbol $branch](fg:crust bg:pink)]($style)"

[git_status]
  style = "bg:pink"
  format = "[[$all_status $ahead_behind](fg:crust bg:pink)]($style)"
  ahead = "⇡ ${count} "
  behind = "⇣ ${count} "
  untracked = " ${count} "
  modified = " ${count} "
  deleted = " ${count} "
  staged = " ${count} "

[golang]
  symbol = ""
  style = "bg:green"
  format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[jobs]
  symbol = "󰒓"
  number_threshold = 1
  symbol_threshold = 1
  style = "bg:cyan"
  format = "[ $symbol $number](fg:crust bg:comment)]($style)"

[line_break]
  disabled = false

[mise]
  disabled = false
  symbol = ""
  healthy_symbol = ""
  unhealthy_symbol = ""
  style = "fg:crust bg:pink"
  format = "[ $symbol $health ]($style)"

[nodejs]
  symbol = ""
  style = "bg:green"
  format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[os]
  disabled = false
  style = "bg:purple fg:crust"
  format = "[ $symbol ]($style)"

[os.symbols]
  Alpine = ""
  Arch = "󰣇"
  Raspbian = "󰐿"
  Ubuntu = "󰕈"
  Windows = "󰍲"

[palettes.dracula]
  base = "#1e1e2e"
  blue = "#644ac9"
  comment = "#6272a4"
  crust = "#262935"
  cyan = "#8be9fd"
  green = "#50fa7b"
  mantle = "#181825"
  pink = "#ff79c6"
  purple = "#bd93f9"
  red = "#ff5555"
  yellow = "#f1fa8c"

  # Orginal
  # crust = "#11111b"

[python]
  symbol = ""
  style = "bg:green"
  format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[shell]
  bash_indicator = "󱆃"
  pwsh_indicator = "_"
  powershell_indicator = ""
  cmd_indicator = ""
  unknown_indicator = ""
  disabled = false
  style = "bg:blue fg:crust"
  format = "[ $indicator ]($style)"

[terraform]
  disabled = false
  style = "bg:comment"
  format = "[via $symbol$workspace]($style)"

[time]
  disabled = false
  time_format = "%H:%M"
  style = "bg:comment"
  format = "[[  $time ](fg:crust bg:comment)]($style)"

[username]
  disabled = true
