#:schema https://starship.rs/config-schema.json
# tombi: format.rules.table-keys-order = "ascending"

command_timeout     = 200
continuation_prompt = " "
#
# Icons nf-ex nf-ple
#
#                        
#                        󰯉  ⬬
# [ ▒▓] [ ░▒▓]     
# ╰ ─         l  ∟ ╰
#  ░▒▓ ▓▒░  ▁▂▃▄▅▆▇█ ▉▊▋▌▍▍▎▏▐  ▏▎▍▌▋▊▉
#              
#
# ╭─ $shell  $os  $directory  $git_branch  $nodejs  $mise  $jobs  $cmd_duration  $time 
# ╰─
#
# #9a348e
# #da627d
# #fca17d
# #86bbd8
# #ff79c6
# #06969a
# #33658a
# #bd93f9
# #50fa7b
# #644ac9
#
format              = """
[╭─](fg:#9a348e bg:#2b2d36)\
$shell\
${env_var.yazi_level}\
[](fg:#9a348e bg:#da627d)\
$os\
[](fg:#da627d bg:#bd93f9)\
$directory\
[](fg:#bd93f9 bg:#86bbd8)\
$git_branch\
$git_status\
[](fg:#86bbd8 bg:#ff79c6)\
$nodejs\
$golang\
$python\
$docker_context\
$terraform\
[](fg:#ff79c6 bg:#06969a)\
$mise\
[](fg:#06969a bg:#33658a)\
$jobs\
[](fg:#33658a bg:#fca17d)\
$cmd_duration\
[](fg:#fca17d bg:#50fa7b)\
$time\
[](fg:#50fa7b bg:#2b2d36)\
$line_break\
[╰─](fg:#9a348e bg:#2b2d36)\
$character"""

# format              = """
# [╭─](fg:#9a348e bg:#2b2d36)\
# $shell\
# ${env_var.yazi_level}\
# [](fg:#9a348e bg:#da627d)\
# $os\
# [](fg:#da627d bg:#fca17d)\
# $directory\
# [](fg:#fca17d bg:#86bbd8)\
# $git_branch\
# $git_status\
# [](fg:#86bbd8 bg:#ff79c6)\
# $nodejs\
# $golang\
# $python\
# $docker_context\
# $terraform\
# [](fg:#ff79c6 bg:#06969a)\
# $mise\
# [](fg:#06969a bg:#33658a)\
# $jobs\
# [](fg:#33658a bg:#bd93f9)\
# $cmd_duration\
# [](fg:#bd93f9 bg:#50fa7b)\
# $time\
# [](fg:#50fa7b bg:#2b2d36)\
# $line_break\
# [╰─](fg:#9a348e bg:#2b2d36)\
# $character"""

# Use the color palette
palette      = "dracula"
scan_timeout = 10

[aws]
  disabled = true

[battery]
  disabled = true

[bun]
  disabled = true

[c]
  disabled = true

[character]
  disabled                  = false
  error_symbol              = "[](bold fg:red)"
  success_symbol            = "[](bold fg:green)"
  vimcmd_replace_one_symbol = "[❮](bold fg:purple)"
  vimcmd_replace_symbol     = "[❮](bold fg:purple)"
  vimcmd_symbol             = "[❮](bold fg:green)"
  vimcmd_visual_symbol      = "[❮](bold fg:yellow)"

[cmd_duration]
  disabled           = false
  format             = "[  in $duration ]($style)"
  min_time_to_notify = 45000
  show_milliseconds  = false
  show_notifications = false
  style              = "fg:#000000 bg:#fca17d"

[directory]
  format            = "[ $path ]($style)"
  repo_root_format  = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
  style             = "fg:#000000 bg:#bd93f9"
  substitutions     = [
    { from = "(/).?[Bb]at(/?)", to = "$1󰭟 $2", regex = true },
    { from = "(/).git(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Dd]elta(/?)", to = "$1󰇂 $2", regex = true },
    { from = "(/).config(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Aa]pi(/?)", to = "$1󱂛 $2", regex = true },
    { from = "(/).?[Aa]nsible(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Aa]stro(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Dd]esktop(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Dd]ocker(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Dd]ocuments(/?)", to = "$1󰈙 $2", regex = true },
    { from = "(/).?[Dd]ownloads(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ll]inks(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Mm]usic(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Pp]erl(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Pp]ictures(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Pp]owershell(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Pp]rojects(/?)", to = "$1󰲋 $2", regex = true },
    { from = "(/).?[Pp]ython(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ss]coop(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ss]ync(/?)", to = "$1󱈖 $2", regex = true },
    { from = "(/).?[Ss]yncb(/?)", to = "$1󱦕 $2", regex = true },
    { from = "(/).?[Uu]buntu(/?)", to = "$1󰕈 $2", regex = true },
    { from = "(/).?[Bb]ash(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Cc]loudflare(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Dd]beaver(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Dd]ev(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ee]leventy(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ee]slint(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Gg]it(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Jj]avascript(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Jj]son(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ll]ess(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ll]inux(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Mm]arkdown(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Mm]d(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Nn]ginx(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Nn]ode(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Nn]pm(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Nn]uxt(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Rr]epos(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ss]sh(/?)", to = "$1󰣀 $2", regex = true },
    { from = "(/).?[Uu]nicode(/?)", to = "$1󰻐 $2", regex = true },
    { from = "(/).?[Vv]ite(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]itejs(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]itess(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]itest(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]scode(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]scode-insider(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]ue(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]uejs(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Vv]uetify(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ww]indows(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Cc]ezmoi(/?)", to = "$1󰭼 $2", regex = true },
    { from = "(/).?[Dd]otnet(/?)", to = "$1󰪮 $2", regex = true },
    { from = "(/).?[Nn]uget(/?)", to = "$1 $2", regex = true },
    { from = "(/).?[Ss]sh(/?)", to = "$1󰣀 $2", regex = true },
    # { from = "(/)(/?)", to = "$1$2", regex = true },
  ]
  truncation_length = 20
  truncation_symbol = "…/"

[docker_context]
  format = "[ $symbol( $context) ]($style)"
  style  = "fg:#000000 bg:#ff79c6"

[elixir]
  disabled = true

[env_var.yazi_level]
  description = "Indicate the shell was launched by `yazi`"
  variable    = "YAZI_LEVEL"
  style       = "bg:#9a348e fg:#ffffff"
  # 🦆: U+1f986 Duck
  symbol      = " "
  format      = "[ $symbol ]($style)"

[fill]
  symbol = " "

[git_branch]
  format = "[ $symbol $branch ]($style)"
  style  = "fg:#000000 bg:#86bbd8"
  symbol = ""

[git_status]
  ahead     = "⇡ ${count} "
  behind    = "⇣ ${count} "
  deleted   = " ${count} "
  format    = "[ $all_status $ahead_behind ]($style)"
  modified  = " ${count} "
  staged    = " ${count} "
  style     = "fg:#000000 bg:#86bbd8"
  untracked = " ${count} "

[golang]
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:#000000 bg:#ff79c6"
  symbol = ""

[jobs]
  format           = "[ $symbol $number](fg:crust bg:comment) ]($style)"
  number_threshold = 1
  style            = "fg:#ffffff bg:#33658a"
  symbol           = "󰒓"
  symbol_threshold = 1

[line_break]
  disabled = false

[mise]
  disabled         = false
  format           = "[ $symbol $health ]($style)"
  healthy_symbol   = ""
  style            = "fg:#000000 bg:#06969a"
  symbol           = "󰭼"
  unhealthy_symbol = ""

[nodejs]
  format = "[ $symbol( $version) ]($style)"
  style  = "fg:#000000 bg:#ff79c6"
  symbol = ""

[os]
  disabled = false
  format   = "[ $symbol ]($style)"
  style    = "bg:#da627d fg:#000000"

[os.symbols]
  Alpine   = ""
  Arch     = "󰣇"
  Raspbian = "󰐿"
  Ubuntu   = "󰕈"
  Windows  = "󰍲"

[palettes.dracula]
  base    = "#1e1e2e"
  blue    = "#644ac9"
  comment = "#6272a4"
  crust   = "#262935"
  cyan    = "#8be9fd"
  green   = "#50fa7b"
  mantle  = "#181825"
  pink    = "#ff79c6"
  purple  = "#bd93f9"
  red     = "#ff5555"
  yellow  = "#f1fa8c"
  # Original crust = "#11111b"

[python]
  format = "[ $symbol( $version)( #$virtualenv) ]($style)"
  style  = "fg:#000000 bg:#ff79c6"
  symbol = ""

[shell]
  bash_indicator       = "󱆃"
  cmd_indicator        = ""
  disabled             = false
  format               = "[ $indicator ]($style)"
  powershell_indicator = ""
  pwsh_indicator       = "_"
  style                = "bg:#9a348e fg:#ffffff"
  unknown_indicator    = ""

[terraform]
  disabled = false
  format   = "[via $symbol $workspace ]($style)"
  style    = "fg:#000000 bg:#ff79c6"

[time]
  disabled    = false
  format      = "[  $time ]($style)"
  style       = "fg:#000000 bg:#50fa7b"
  time_format = "%H:%M"

[username]
  disabled = true
