#:schema https://mise.jdx.dev/schema/mise.json

[settings.skills]
dir = ".agents/skills"
auto_sync = true
prune = true

[settings.packslip]
exec = true

[task_config]
includes = ["tasks.toml"]

[task_config.cache]
enabled = true

[tools]
shellharden = "latest"
shellcheck = "0.11.0"
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"
"npm:@masculinecache/chezmoi-axi" = "latest"
"npm:@masculinecache/mem-axi" = "latest"
"npm:@masculinecache/bws-axi" = "latest"
