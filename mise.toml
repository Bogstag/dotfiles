#:schema https://mise.jdx.dev/schema/mise.json

[settings.skills]
dir = ".agents/skills"
auto_sync = true
prune = true

[settings.packslip]
exec = true

[task_config]
includes = ["tasks.toml"]

[task_config.cache]
enabled = true

[tools]
tombi = "latest"
hk = "latest"
pkl = "latest"
shfmt = "latest"
markdownlint-cli2 = "latest"
shellharden = "latest"
shellcheck = "latest"
