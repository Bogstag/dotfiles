#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[env]
  _.path = ["node_modules/.bin"]

[settings.packslip]
  exec = true

[settings.skills]
  auto_sync = true
  dir       = ".agents/skills"
  fetch     = true
  prune     = true

[task_config]
  includes = ["tasks.toml"]

[task_config.cache]
  enabled = true

[tools]
  "aqua:Kampfkarren/selene/light" = "latest"
  "aqua:owenlamont/ryl"           = "latest"
  "npm:markdownlint-cli"          = "latest"
  betterleaks                     = "latest"
  fnox                            = "latest"
  hk                              = "latest"
  jactionlint                     = "latest"
  oxfmt                           = "latest"
  oxlint                          = "latest"
  pkl                             = "latest"
  shellcheck                      = "latest"
  shfmt                           = "latest"
  tombi                           = "latest"

[wrappers.python]
  command = "uv"
  args    = ["run", "python"]
