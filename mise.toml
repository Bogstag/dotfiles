#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[env]
  _.path = ["node_modules/.bin"]

[settings.packslip]
  exec = true

[settings.skills]
  dir       = ".agents/skills"
  auto_sync = false
  prune     = true

[task_config]
  includes = ["tasks.toml"]

[task_config.cache]
  enabled = true

# tombi: format.rules.table-keys-order = "ascending"
[tools]
  "aqua:Kampfkarren/selene/light" = "latest"
  "aqua:owenlamont/ryl"           = "latest"
  betterleaks                     = "latest"
  "npm:markdownlint-cli"          = "latest"
  oxfmt                           = "latest"
  oxlint                          = "latest"
  pkl                             = "latest"
  shellcheck                      = "latest"
  shfmt                           = "latest"
  tombi                           = "latest"
