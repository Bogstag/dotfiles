#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[settings.packslip]
  exec = true

[settings.skills]
  dir = ".agents/skills"
  auto_sync = true
  prune = true

[task_config]
  includes = ["tasks.toml"]

[task_config.cache]
  enabled = true

[tools]
  go = "latest"
  hk = { version = "latest", workflow = "release.yml" }
  pkl = "latest"
