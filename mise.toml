#:schema https://mise.jdx.dev/schema/mise.json
# tombi: format.rules.table-keys-order = "ascending"

[env]
_.path = ["node_modules/.bin"]

[settings.packslip]
exec = true

[settings.skills]
dir = ".agents/skills"
auto_sync = false
prune = true

[task_config]
includes = ["tasks.toml"]

[task_config.cache]
enabled = true

# tombi: format.rules.table-keys-order = "ascending"
[tools]
age = "latest"
"aqua:Kampfkarren/selene" = "latest"
"aqua:owenlamont/ryl" = "latest"
betterleaks = "latest"
bitwarden-secrets-manager = "latest"
editorconfig-checker = "latest"
fnox = { version = "latest", workflow = "release.yml" }
go = "latest"
hk = { version = "latest", workflow = "release.yml" }
hunk = "latest"
lua = "latest"
lua-language-server = "latest"
oxfmt = "latest"
oxlint = "latest"
pkl = "latest"
shellcheck = "latest"
shellharden = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
