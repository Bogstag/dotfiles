#:schema https://mise.jdx.dev/schema/mise.json

[task_config]
includes = ["tasks.toml"]
global_env = ["BW_SESSION"]
global_pass_through_env = ["BW_SESSION"]

[task_config.cache]
enabled = true
env = ["BW_SESSION"]

[tools]
tombi = "latest"
hk = "latest"
pkl = "latest"
shfmt = "latest"
markdownlint-cli2 = "latest"
shellharden = "latest"
shellcheck = "latest"
