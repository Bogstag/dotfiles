# See https://github.com/crate-ci/typos/blob/master/docs/reference.md to configure typos
[files]
  extend-exclude = [
    ".agents",
    ".codegraph",
    ".codex",
    ".github",
    ".ryl_cache",
    ".vitepress/cache",
    ".vitepress/dist",
    ".vscode",
    "node_modules",
    "project-words.txt"
  ]
  ignore-hidden  = true
  ignore-files   = false
  ignore-dot     = true
  ignore-vcs     = true
  ignore-global  = false
  ignore-parent  = false

[default]
  binary                       = false
  check-filename               = true
  check-file                   = true
  unicode                      = true
  ignore-hex                   = true
  identifier-leading-digits    = true
  locale                       = "en"
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[default.extend-identifiers]
  hass  = "hass"
  brite = "brite"

[default.extend-words]
  brite      = "brite"
  hass       = "hass"
  caligraphy = "caligraphy"
  characte   = "characte"
  chiseled   = "chiseled"
  ot         = "ot"
  fireing    = "fireing"
  ue         = "ue"
  sketchs    = "sketchs"

[type.lua]
  extend-glob                  = ["**/*.lua"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.readme]
  extend-glob                  = ["**/README.md"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.lock]
  extend-glob                  = ["**/*-lock*"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.json]
  extend-glob                  = ["**/*.json"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.svg]
  extend-glob                  = ["**/*.svg"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.toml]
  extend-glob                  = ["**/*.toml"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.ts]
  extend-glob                  = ["**/*.ts", "**/*.mts"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.txt]
  extend-glob                  = ["**/*.txt"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.yaml]
  extend-glob                  = ["**/*.yaml", "**/*.yml"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.sh]
  extend-glob                  = ["**/*.sh", "**/*.bash"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.sh.extend-identifiers]
  ot   = "ot"
  stap = "stap"

[type.sh.extend-words]

[type.md]
  extend-glob                  = ["**/*.md"]
  binary                       = false
  check-filename               = true
  check-file                   = true
  unicode                      = true
  locale                       = "en-gb"
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.md.extend-identifiers]
  hass  = "hass"
  brite = "brite"

[type.md.extend-words]
  hass  = "hass"
  brite = "brite"

[type.py]
  extend-glob                  = ["**/*.py"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.py.extend-identifiers]
  arange   = "arange"
  certifi  = "certifi"
  NDArray  = "NDArray"
  EOFError = "EOFError"
  asend    = "asend"

[type.py.extend-words]

[type.css]
  extend-glob                  = ["**/*.css"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.css.extend-identifiers]
  nd = "nd"

[type.css.extend-words]

[type.rust]
  extend-glob                  = ["**/*.rs", "**/Cargo.toml"]
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[type.rust.extend-identifiers]
  ratatui = "ratatui"
  flate2  = "flate2"

[type.rust.extend-words]
  ser = "ser"
