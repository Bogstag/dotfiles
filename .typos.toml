# See https://github.com/crate-ci/typos/blob/master/docs/reference.md to configure typos
[files]
  extend-exclude = [
    ".agents",
    ".codegraph",
    ".codex",
    ".github",
    ".ryl_cache",
    ".vitepress/cache",
    ".vitepress/dist",
    ".vscode",
    "node_modules",
    "project-words.txt"
  ]
  ignore-hidden  = true
  ignore-files   = true
  ignore-dot     = true
  ignore-vcs     = true
  ignore-global  = true
  ignore-parent  = true

[default]
  binary                       = false
  check-filename               = true
  check-file                   = true
  unicode                      = true
  ignore-hex                   = true
  identifier-leading-digits    = true
  locale                       = "en-gb"
  extend-ignore-identifiers-re = []
  extend-ignore-words-re       = []
  extend-ignore-re             = []

[default.extend-identifiers]
  hass  = "hass"
  brite = "brite"

[default.extend-words]
  brite      = "brite"
  hass       = "hass"
  chiseled   = "chiseled"
  ot         = "ot"
  ue         = "ue"
  sketchs    = "sketchs"
  capitalize = "capitalize"
  Color      = "Color"
  summarize  = "summarize"

[type.lua]
  extend-glob = ["**/*.lua"]

[type.readme]
  extend-glob = ["**/README.md"]

[type.lock]
  extend-glob = ["**/*-lock*"]

[type.json]
  extend-glob        = ["**/*.json"]
  extend-identifiers = { hass = "hass" }

[type.svg]
  extend-glob = ["**/*.svg"]

[type.toml]
  extend-glob = ["**/*.toml"]

[type.ts]
  extend-glob = ["**/*.ts", "**/*.mts"]

[type.txt]
  extend-glob = ["**/*.txt"]

[type.yaml]
  extend-glob = ["**/*.yaml", "**/*.yml"]

[type.sh]
  extend-glob = ["**/*.sh", "**/*.bash"]

[type.sh.extend-identifiers]
  ot   = "ot"
  stap = "stap"

[type.sh.extend-words]

[type.md]
  extend-glob    = ["**/*.md"]
  binary         = false
  check-filename = true
  check-file     = true
  unicode        = true

[type.md.extend-identifiers]
  hass  = "hass"
  brite = "brite"

[type.md.extend-words]
  brite = "brite"

[type.py]
  extend-glob = ["**/*.py"]

[type.py.extend-identifiers]
  certifi  = "certifi"
  NDArray  = "NDArray"
  EOFError = "EOFError"
  asend    = "asend"

[type.py.extend-words]

[type.css]
  extend-glob = ["**/*.css"]

[type.css.extend-identifiers]
  nd = "nd"

[type.css.extend-words]

[type.rust]
  extend-glob = ["**/*.rs", "**/Cargo.toml"]

[type.rust.extend-identifiers]
  flate2 = "flate2"

[type.rust.extend-words]
  ser = "ser"
