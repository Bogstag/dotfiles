#:schema https://mise.jdx.dev/schema/mise-task.json

["Check"]
  description = "Checks modified files"
  run         = "hk check"

["Fix"]
  run = "hk fix --all"

["Check Stage Unstaged"]
  description = "Check changed files and stage them if ok"
  run         = "mise exec -- hk check --no-fail-fast --unstaged  --stage --junit-xml ./tests/check-stage-unstaged_latest.xml"

["Plan Check Stage Unstaged"]
  description = "Generate plan for Check-Stage-unstaged task"
  run         = "mise run Check-Stage-Unstaged --plan"

["Fix Stage Unstaged"]
  description = "Fix changed files and stage them if ok"
  run         = "mise exec -- hk fix --no-fail-fast --unstaged --stage --junit-xml ./tests/fix-stage-unstaged_latest.xml"

["Plan Fix Stage Unstaged"]
  description = "Generate plan for Fix-Stage-unstaged task"
  run         = "mise run Fix-Stage-Unstaged --plan"

["Chezmoi Edit Config"]
  run = "chezmoi edit-config"

["format:gotmpl:write"]
  description = "Format go templates"
  env         = { CLICOLOR_FORCE = "0" }
  outputs     = [""]
  run         = "gotmplfmt -w ${file}"
  sources     = ["gotmplfmt"]

["Get All Files Ext In Workspace"]
  run = '''
  #!/usr/bin/env bash
  find . -type f | sed -rn 's|.*/[^/]+\.([^/.]+)$|\1|p' | sort -u
  '''

["Mise:Upgrade"]
  # Use mise upgrade to install newer versions within the configured ranges and update the lockfile.
  run = "mise upgrade --bump"

["Render:TasksDoc"]
  description = "Generate tasks documentation"
  env         = { CLICOLOR_FORCE = "0" }
  outputs     = ["README.md"]
  run         = [
    "mise generate task-docs --output README.md --style detailed --inject ",
  ]
  sources     = ["mise"]

["Ryl:UpdateSchema"]
  run = "ryl --print-toml-config-schema > $HOME/.config/ryl/ryl.json"

[pre-commit]
  run = "mise exec -- hk run pre-commit --no-stage --junit-xml ./tests/pre-commit.xml"

["Mise:SyncSkills"]
  description = "Add or update skills in repo"
  run         = "mise skills sync --dir .agents/skills"

["Docs:UpdateYaziExternalMarkdown"]
  # TODO: Find a way to run this auto after plugin update.
  description = "Re add yazi external plugins md files"
  run         = '''
  #!/usr/bin/env bash
  if [[ ! -d "$(chezmoi source-path)/dot_config/yazi/plugins" ]]; then
    mkdir -m=0755 $(chezmoi source-path)/dot_config/yazi/plugins
  fi

  find $(chezmoi source-path)/dot_config/yazi/plugins/ -type f -nowarn -iname '*.md' -delete
  find ~/.config/yazi/plugins -type f -name '*.md' -exec bash -c '
  for file do
      dir="${file%/*}"
      name="${dir##*/}"
      cp -- "$file" "$(chezmoi source-path)/dot_config/yazi/plugins/$name.md"
    done
  ' bash {} +
  generate_md_index $(chezmoi source-path)/dot_config/yazi/plugins "Plugins"
'''

["Docs:UpdatePluginsExternalMarkdown"]
  # TODO: Find a way to run this auto after plugin update.
  description = "Re add external plugins md files"
  run         = [
    "rm -f home/dot_config/omarchy/plugins/*/{private_preview,preview}.png",
    "rm -f home/dot_config/omarchy/plugins/*/{private_CHANGELOG,private_README,CHANGELOG,README}.md",
    "chezmoi add --exact ~/.config/omarchy/plugins/*/preview.png",
    "chezmoi add --exact ~/.config/omarchy/plugins/*/{CHANGELOG,README}.md",
  ]
