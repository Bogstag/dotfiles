#:schema https://mise.jdx.dev/schema/mise-task.json

[Unlock-Bitwarden]
allow_env = ["BW_SESSION"]
pass_through_env = ["BW_SESSION"]
cache = { enabled = true, env = ["BW_SESSION"] }
interactive = true
run = '''
#!/usr/bin/env bash
export BW_SESSION=$(bw unlock --raw)
'''
sources = ["tasks.toml"]
outputs = []

["render:tasks"]
description = "Generate tasks documentation"
env = { CLICOLOR_FORCE = "0" }
run = [
  "mise generate task-docs --output tasks.md --style detailed",
]
sources = ["mise"]
outputs = ["tasks.md"]

["tombi:format"]
alias = "tf"
description = "Format toml"
run = "tombi format"
sources = ["**/*.toml", "**/*.toml.tmpl"]

[pre-commit]
run = "hk run pre-commit"
