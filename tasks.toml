#:schema https://mise.jdx.dev/schema/mise-task.json

[Unlock-Bitwarden]
description = "Unlock Bitwarden session and store token in tmpfs runtime directory"
interactive = true
run = '''
#!/usr/bin/env bash
set -eu
session_file="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/bw_session"
bw unlock --raw > "$session_file"
chmod 600 "$session_file"
echo "Bitwarden unlocked for current login session ($session_file)."
'''
sources = ["tasks.toml"]
outputs = []

["render:tasks"]
description = "Generate tasks documentation"
env = { CLICOLOR_FORCE = "0" }
run = [
  "mise generate task-docs --output tasks.md --style detailed",
]
sources = ["mise"]
outputs = ["tasks.md"]

[pre-commit]
run = "hk run pre-commit"

[check]
run = "hk check --all --no-fail-fast"

[fix]
run = "hk fix --all --no-fail-fast"
